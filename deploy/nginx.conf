events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Port-based virtual host: same name as Ito, different port, same wildcard
    # certificate (*.it.kmitl.ac.th covers the hostname on any port). Ito's own
    # nginx keeps 80 and 443; nothing here touches it.
    server {
        listen 8443 ssl;
        http2 on;
        server_name ito.it.kmitl.ac.th;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Screenshots POST to /api/upload at up to 10 MB (MAX_UPLOAD_BYTES in
        # packages/protocol/src/limits.ts). nginx defaults to 1m and would 413
        # them; 12m leaves headroom above the app's own check, so the app gets
        # to return its friendly error instead of nginx returning a blank one.
        client_max_body_size 12m;

        location / {
            proxy_pass http://app:3000;

            # One port carries both the page and the /ws socket.
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            # A paper left open overnight must not be cut loose. The app's own
            # heartbeat is 30s, so this only guards against the proxy giving up.
            proxy_read_timeout 3600s;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
