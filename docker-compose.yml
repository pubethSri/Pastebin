# A self-contained stack: the pastebin plus its own TLS front door on 8443.
# Deliberately separate from Ito's compose project so that deploying, rebuilding
# or breaking this one cannot take the live game on 80/443 down with it. The two
# only share the certificate files, mounted read-only from SSL_DIR.
#
#   docker compose up -d --build

services:
  app:
    build:
      context: .
      args:
        BUILD_CLI: ${BUILD_CLI:-1}
    restart: always
    environment:
      - PORT=3000
      - DB_PATH=/data/pastebin.sqlite
      - ROOM_EMPTY_GRACE_MINUTES=${ROOM_EMPTY_GRACE_MINUTES:-5}
      - ROOM_TTL_DAYS=${ROOM_TTL_DAYS:-30}
    volumes:
      - pastebin_data:/data
    # No `ports:` on purpose. nginx reaches it over the compose network, so the
    # plain-HTTP origin is never published the way Ito's :3000 is — which also
    # means nobody can reach the app over a non-secure context and lose the
    # clipboard API.
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8443:8443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${SSL_DIR:?set SSL_DIR in .env}/STAR_IT_KMITL_AC_TH_PACK.crt:/etc/nginx/ssl/server.crt:ro
      - ${SSL_DIR:?set SSL_DIR in .env}/STAR_IT_KMITL_AC_TH.key:/etc/nginx/ssl/server.key:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  pastebin_data:
